<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Trophy / Star Chibi Symbol -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="200" r="110" fill="white"/>
    <polygon points="256,120 278,168 330,175 292,212 301,264 256,238 211,264 220,212 182,175 234,168" fill="url(#gold)"/>
    <!-- Chibi Cute Eyes on Star -->
    <ellipse cx="242" cy="195" rx="5" ry="7" fill="#1e293b"/>
    <ellipse cx="270" cy="195" rx="5" ry="7" fill="#1e293b"/>
    <circle cx="240" cy="192" r="2.5" fill="white"/>
    <circle cx="268" cy="192" r="2.5" fill="white"/>
    <path d="M250 206 Q256 214 262 206" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="232" cy="202" rx="6" ry="3.5" fill="#f472b6" opacity="0.8"/>
    <ellipse cx="280" cy="202" rx="6" ry="3.5" fill="#f472b6" opacity="0.8"/>
  </g>

  <!-- Banner text -->
  <rect x="76" y="340" width="360" height="96" rx="48" fill="white" filter="url(#shadow)"/>
  <text x="256" y="405" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="900" font-size="52" fill="#3b82f6" text-anchor="middle">LỚP 9A4</text>
  <text x="256" y="475" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle">THI ĐUA CHỦ NHIỆM</text>
</svg>

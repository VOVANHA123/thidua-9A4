      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.3rem;
      color: #38bdf8;

    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);

    .btn:hover {

    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 0.85rem;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #334155;

    tr:nth-child(even) {

    .badge {

</head>

    // Render Preview
    const tbody = document.querySelector('#previewTable tbody');
    students9A4.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align: center;">${s.stt}</td>
        <td><strong>${s.name}</strong></td>
        <td style="text-align: center;">Tổ ${s.team}</td>
        <td><span class="badge ${s.role.includes('trưởng') ? 'badge-lead' : (s.role.includes('phó') ? 'badge-mon' : '')}">${s.role}</span></td>
        <td style="text-align: center; color: #38bdf8;"><em>(Tự động tạo)</em></td>
        <td style="text-align: center;">${s.passHs}</td>
        <td style="text-align: center;">${s.passPh}</td>
      `;
      tbody.appendChild(tr);
    });

    async function downloadClassExcel() {
      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'Sổ Thi Đua Điện Tử';
      workbook.created = new Date();

      const worksheet = workbook.addWorksheet('Danh_Sach_Hoc_Sinh', {
        views: [{ state: 'frozen', ySplit: 1 }]
      });

      worksheet.columns = [
        { header: 'STT', key: 'stt', width: 8 },
        { header: 'HoTen', key: 'name', width: 28 },
        { header: 'To', key: 'team', width: 10 },
        { header: 'ChucVu', key: 'role', width: 18 },
        { header: 'MaHocSinh', key: 'code', width: 16 },
        { header: 'MatKhauHS', key: 'passHs', width: 16 },
        { header: 'MatKhauPH', key: 'passPh', width: 16 }
      ];

      // Header styling
      const headerRow = worksheet.getRow(1);
      headerRow.height = 28;
      headerRow.eachCell((cell) => {
        cell.fill = {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: 'FFEA580C' }
        };
        cell.font = {
          name: 'Segoe UI',
          size: 11,
          bold: true,
          color: { argb: 'FFFFFFFF' }
        };
        cell.alignment = { vertical: 'middle', horizontal: 'center' };
      });

      students9A4.forEach((s) => {
        const row = worksheet.addRow({
          stt: s.stt,
          name: s.name,
          team: s.team,
          role: s.role,
          code: s.code, // để trống để web tự ghép [Mã Trường] + [9A4] + [STT] chuẩn 100% không lo sai mã
          passHs: s.passHs,
          passPh: s.passPh
        });
        row.height = 22;
        row.getCell('stt').alignment = { vertical: 'middle', horizontal: 'center' };
        row.getCell('name').alignment = { vertical: 'middle', horizontal: 'left' };
        row.getCell('team').alignment = { vertical: 'middle', horizontal: 'center' };
        row.getCell('role').alignment = { vertical: 'middle', horizontal: 'center' };
        row.getCell('code').alignment = { vertical: 'middle', horizontal: 'center' };
        row.getCell('passHs').alignment = { vertical: 'middle', horizontal: 'center' };
        row.getCell('passPh').alignment = { vertical: 'middle', horizontal: 'center' };
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Danh_Sach_29_Hoc_Sinh_Lop_9A4_Chuan.xlsx';
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
